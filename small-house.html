<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>숨은그림찾기 스케치북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky legend strip on top (phone) / left rail (desktop); the original pencil drawing is the playfield, zoomable and scrollable. */
:root{
  --bg:#e8ecea;
  --panel:#f6f8f7;
  --ink:#23292d;
  --ink-soft:#5b666c;
  --line:#c7cfcc;
  --accent:#2563d6;
  --accent-ink:#ffffff;
  --good:#1f8a4c;
  --bad:#d4402a;
  --paper:#ffffff;
  --font-display:'Gaegu','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181a;--panel:#1d2326;--ink:#e6ecea;--ink-soft:#9aa7ac;--line:#2f393d;
    --accent:#6ea0ff;--accent-ink:#0b1220;--good:#5fd18f;--bad:#ff7a63;--paper:#2a3236;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181a;--panel:#1d2326;--ink:#e6ecea;--ink-soft:#9aa7ac;--line:#2f393d;
  --accent:#6ea0ff;--accent-ink:#0b1220;--good:#5fd18f;--bad:#ff7a63;--paper:#2a3236;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:12px 28px;-webkit-tap-highlight-color:transparent}
.app{max-width:1280px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
h1{margin:0;font-family:var(--font-display);font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:13px;color:var(--ink-soft)}
.chip b{font-size:16px;font-weight:700;color:var(--ink)}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;margin-inline:-16px;padding-inline:16px}
.legend{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin}
.item{flex:0 0 auto;width:92px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;position:relative;min-width:0}
.item canvas{width:100%;height:64px;object-fit:contain;display:block;border-radius:4px;background:var(--paper)}
.item span{font-size:12px;font-weight:500;white-space:nowrap}
.item .tick{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-size:13px;line-height:20px;text-align:center;display:none;font-weight:700}
.item.found{border-color:var(--good)}
.item.found canvas{opacity:.45}
.item.found span{color:var(--good);text-decoration:line-through;text-decoration-thickness:1px}
.item.found .tick{display:block}
.item.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.main{display:grid;gap:10px;min-width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.btn{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;min-height:40px}
button.btn:hover{border-color:var(--ink-soft)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.zoom{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.zoom output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.stage{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:6px;background:var(--paper);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet{position:relative;width:100%;line-height:0;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y pinch-zoom}
.sheet.zoomed{cursor:grab}
.sheet.dragging{cursor:grabbing}
.sheet img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.mark{position:absolute;border:4px solid var(--c,#e5484d);border-radius:50%;pointer-events:none;animation:ring .6s ease-out;box-shadow:0 0 0 2px #fff,0 0 12px 2px rgba(0,0,0,.12)}
.mark.reveal{border-style:dashed}
.mark.below em{top:auto;bottom:-4px;transform:translate(-50%,100%)}
.mark em{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);font:700 clamp(16px,2.4vw,22px)/1.15 var(--font-body);font-style:normal;white-space:nowrap;color:#fff;-webkit-text-stroke:6px var(--c,#e5484d);paint-order:stroke fill;letter-spacing:.02em}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.3);opacity:0}}
.spark{position:absolute;width:11px;height:11px;margin:-5px 0 0 -5px;border-radius:2px;pointer-events:none;background:var(--c);animation:spark .85s cubic-bezier(.15,.7,.3,1) forwards;z-index:3}
.confetti{position:fixed;left:0;top:0;width:100%;height:0;z-index:30;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(var(--r));opacity:.9}}
button.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@keyframes ring{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.miss{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;color:var(--bad);font:700 26px/28px var(--font-body);text-align:center;pointer-events:none;animation:miss .7s ease-out forwards}
@keyframes miss{to{opacity:0;transform:translateY(-14px)}}
.help{margin:0;color:var(--ink-soft);font-size:13px}
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,16,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:380px;width:100%;display:grid;gap:12px;text-align:center}
.dialog h2{margin:0;font-family:var(--font-display);font-size:34px;line-height:1.1}
.dialog dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;text-align:left;font-variant-numeric:tabular-nums}
.dialog dt{color:var(--ink-soft)}.dialog dd{margin:0;font-weight:700}
.dialog .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.play-only{display:inline-flex;gap:8px;flex-wrap:wrap}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr);align-items:start}
  header{grid-column:1/-1}
  .rail{position:sticky;top:12px;margin:0;padding:0;background:transparent}
  .legend{flex-direction:column;overflow:visible;gap:8px}
  .item{width:100%;flex-direction:row;gap:10px;padding:6px 10px 6px 6px}
  .item canvas{width:72px;height:56px;flex:0 0 auto}
  .item span{font-size:14px}
  .item .tick{top:50%;right:8px;margin-top:-10px}
  .stage{max-height:82vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

    {id:'pizza',color:'#c7522a',name:'피자',          crop:[455,205,610,490], rects:[[1318,533,1461,757]],poly:[[1431,533],[1324,592],[1318,606],[1435,748],[1448,756],[1458,751],[1460,736],[1441,538]]},
    {id:'door',color:'#3b6fd8',name:'문',            crop:[85,315,290,700],  rects:[[2044,1156,2256,1543]],poly:[[2067,1162],[2060,1170],[2062,1188],[2049,1304],[2044,1533],[2056,1542],[2248,1541],[2255,1533],[2255,1397],[2249,1272],[2252,1170],[2239,1160],[2172,1156]]},
    {id:'sweet',color:'#8a55d7',name:'고구마',        crop:[325,300,525,570], rects:[[1036,282,1216,550]],poly:[[1041,284],[1036,297],[1042,392],[1068,446],[1131,505],[1195,547],[1210,547],[1215,533],[1179,478],[1127,378],[1098,341],[1095,329],[1074,300],[1054,283]]},
    {id:'cookie',color:'#12a0a0',name:'갉아먹은 과자', crop:[335,605,500,810], rects:[[676,86,866,276]],poly:[[803,91],[780,88],[742,99],[717,113],[693,146],[686,172],[690,222],[706,254],[724,269],[747,273],[756,268],[756,245],[761,236],[760,208],[771,186],[787,184],[809,168],[835,174],[857,160],[856,148],[837,113]]},
    {id:'ice',color:'#d6479a',name:'아이스크림바',  crop:[505,585,635,745], rects:[[869,1043,960,1138]],poly:[[879,1055],[869,1086],[871,1098],[914,1133],[927,1137],[946,1133],[957,1119],[959,1094],[945,1066],[926,1046],[917,1043],[894,1055]]}
  ];
  var PAD=34, LEGEND_CUT=[0,0,770,960];
  var $=function(id){return document.getElementById(id)};
  var sheet=$('sheet'),pic=$('pic'),stage=$('stage'),legend=$('legend');
  var found,misses,hints,startedAt,elapsed,timerId,over,zoom=1,els={};

  function store(get,key,val){try{return get?localStorage.getItem(key):localStorage.setItem(key,val)}catch(e){return null}}
  function fmt(s){var m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+(r<10?'0':'')+r}
  function pct(v,t){return (v/t*100)+'%'}

  function buildLegend(){
    legend.innerHTML='';
    ITEMS.forEach(function(it){
      var b=document.createElement('button');b.type='button';b.className='item';b.dataset.id=it.id;
      var c=document.createElement('canvas');c.width=160;c.height=128;c.setAttribute('aria-hidden','true');
      var s=document.createElement('span');s.textContent=it.name;
      var t=document.createElement('i');t.className='tick';t.textContent='✓';t.style.fontStyle='normal';t.setAttribute('aria-hidden','true');
      b.appendChild(c);b.appendChild(s);b.appendChild(t);
      b.setAttribute('aria-label',it.name);
      b.addEventListener('click',function(){onLegend(it)});
      legend.appendChild(b);els[it.id]=b;it.canvas=c;
    });
    drawThumbs();
  }
  function drawThumbs(){
    if(!pic.naturalWidth)return;
    var k=pic.naturalWidth/W;
    ITEMS.forEach(function(it){
      var c=it.canvas,ctx=c.getContext('2d');
      var sx=it.crop[0]*k,sy=it.crop[1]*k,sw=(it.crop[2]-it.crop[0])*k,sh=(it.crop[3]-it.crop[1])*k;
      ctx.fillStyle='#f4f5f4';ctx.fillRect(0,0,c.width,c.height);
      var sc=Math.min(c.width/sw,c.height/sh),dw=sw*sc,dh=sh*sc;
      ctx.drawImage(pic,sx,sy,sw,sh,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
    });
  }

  function reset(){
    found={};misses=0;startedAt=0;elapsed=0;over=false;
    clearInterval(timerId);timerId=0;
    Array.prototype.slice.call(sheet.querySelectorAll('.mark,.miss')).forEach(function(n){n.remove()});
    ITEMS.forEach(function(it){els[it.id].classList.remove('found','pop')});
    $('win').hidden=true;
    update();
  }
  function update(){
    var n=Object.keys(found).length;
    $('count').textContent=n+' / '+ITEMS.length;
    $('timer').textContent=fmt(elapsed);
  }
  function startTimer(){
    if(timerId||over)return;
    startedAt=Date.now()-elapsed*1000;
    timerId=setInterval(function(){elapsed=(Date.now()-startedAt)/1000;$('timer').textContent=fmt(elapsed)},500);
  }

  function addMark(it,reveal){
    it.rects.forEach(function(r,i){
      var w=r[2]-r[0],h=r[3]-r[1],cx=(r[0]+r[2])/2,cy=(r[1]+r[3])/2;
      var mw=Math.max(w*1.08,130),mh=Math.max(h*1.08,130);
      var d=document.createElement('div');d.className='mark'+(reveal?' reveal':'');d.style.setProperty('--c',it.color);if(cy-mh/2<90)d.classList.add('below');
      d.style.left=pct(cx-mw/2,W);d.style.top=pct(cy-mh/2,H);d.style.width=pct(mw,W);d.style.height=pct(mh,H);
      if(i===0){var e=document.createElement('em');e.textContent=it.name;d.appendChild(e)}
      sheet.appendChild(d);
    });
  }

  function inPoly(x,y,p){
    var c=false;
    for(var i=0,j=p.length-1;i<p.length;j=i++){
      if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;
    }
    return c;
  }
  function hit(nx,ny){
    var x=nx*W,y=ny*H,best=null,bd=1e9;
    ITEMS.forEach(function(it){
      if(found[it.id])return;
      it.rects.forEach(function(r){
        var cx=(r[0]+r[2])/2,cy=(r[1]+r[3])/2,rad=(r[2]-r[0])/2,d=Math.hypot(x-cx,y-cy);
        if(it.poly){if(inPoly(x,y,it.poly)&&d/rad<bd){bd=d/rad;best=it}return}
        if(d<=rad+PAD&&d/rad<bd){bd=d/rad;best=it}
      });
    });
    return best;
  }

  function tap(cx,cy){
    if(over)return;
    var b=sheet.getBoundingClientRect(),nx=(cx-b.left)/b.width,ny=(cy-b.top)/b.height;
    if(nx<0||ny<0||nx>1||ny>1)return;
    startTimer();
    if(nx*W<LEGEND_CUT[2]&&ny*H<LEGEND_CUT[3]&&nx*W>0&&ny*H<640&&nx*W<1000&&inLegendBox(nx*W,ny*H))return;
    var it=hit(nx,ny);
    if(it){
      found[it.id]=true;addMark(it,false);burst(it);sfxFound(Object.keys(found).length-1);
      var el=els[it.id];el.classList.add('found','pop');
      setTimeout(function(){el.classList.remove('pop')},600);
      update();
      if(Object.keys(found).length===ITEMS.length)finish();
    }else{
      misses++;sfxMiss();
      var m=document.createElement('div');m.className='miss';m.textContent='✕';
      m.style.left=(nx*100)+'%';m.style.top=(ny*100)+'%';sheet.appendChild(m);
      setTimeout(function(){m.remove()},800);
      stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
    }
  }
  function inLegendBox(x,y){return x<770&&y<960}

  function finish(){
    over=true;clearInterval(timerId);timerId=0;
    elapsed=(Date.now()-startedAt)/1000;update();
    var key='hidden-sketch-best',prev=parseFloat(store(true,key));
    if(!(prev>0)||elapsed<prev){store(false,key,String(elapsed));prev=elapsed}
    setTimeout(function(){sfxWin();confetti()},350);
    $('wTime').textContent=fmt(elapsed);$('wMiss').textContent=misses;$('wBest').textContent=fmt(prev);
    setTimeout(function(){$('win').hidden=false;$('again').focus()},700);
  }

  function scrollToRect(r){
    var w=sheet.clientWidth,h=sheet.clientHeight;
    var cx=(r[0]+r[2])/2/W*w,cy=(r[1]+r[3])/2/H*h;
    stage.scrollTo({left:cx-stage.clientWidth/2,top:cy-stage.clientHeight/2,behavior:'smooth'});
  }
  function onLegend(it){
    if(found[it.id]){scrollToRect(it.rects[0]);return}
  }

  function reveal(){
    if(over)return;
    over=true;clearInterval(timerId);timerId=0;
    ITEMS.forEach(function(it){if(!found[it.id])addMark(it,true)});
  }

  function setZoom(z){
    z=Math.max(1,Math.min(4,Math.round(z*4)/4));
    var oldW=sheet.clientWidth,cx=(stage.scrollLeft+stage.clientWidth/2)/oldW,cy=(stage.scrollTop+stage.clientHeight/2)/(sheet.clientHeight||1);
    zoom=z;sheet.classList.toggle('zoomed',z>1);sheet.style.width=(z*100)+'%';$('zoomVal').textContent=Math.round(z*100)+'%';
    stage.scrollLeft=cx*sheet.clientWidth-stage.clientWidth/2;
    stage.scrollTop=cy*sheet.clientHeight-stage.clientHeight/2;
  }

  var down=null;
  var drag=null;
  sheet.addEventListener('pointerdown',function(e){
    down={x:e.clientX,y:e.clientY,t:Date.now(),sl:stage.scrollLeft,st:stage.scrollTop};
    drag=(e.pointerType==='mouse'&&e.button===0)?{x:e.clientX,y:e.clientY,sl:stage.scrollLeft,st:stage.scrollTop,on:false,id:e.pointerId}:null;
  });
  sheet.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.on){
      if(Math.hypot(dx,dy)<6)return;
      drag.on=true;sheet.classList.add('dragging');
      try{sheet.setPointerCapture(drag.id)}catch(x){}
    }
    stage.scrollLeft=drag.sl-dx;stage.scrollTop=drag.st-dy;
  });
  function endDrag(){drag=null;sheet.classList.remove('dragging')}
  sheet.addEventListener('pointerup',endDrag);
  sheet.addEventListener('pointercancel',endDrag);
  sheet.addEventListener('lostpointercapture',endDrag);
  sheet.addEventListener('pointerup',function(e){
    if(!down)return;
    var moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),scrolled=Math.abs(stage.scrollLeft-down.sl)+Math.abs(stage.scrollTop-down.st);
    var ok=moved<10&&scrolled<4&&Date.now()-down.t<600;down=null;
    if(ok)tap(e.clientX,e.clientY);
  });
  sheet.addEventListener('pointercancel',function(){down=null});

  $('revealBtn').addEventListener('click',reveal);
  $('resetBtn').addEventListener('click',reset);
  $('again').addEventListener('click',reset);
  $('closeWin').addEventListener('click',function(){$('win').hidden=true});
  $('zoomIn').addEventListener('click',function(){setZoom(zoom+.5)});
  $('zoomOut').addEventListener('click',function(){setZoom(zoom-.5)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')$('win').hidden=true});


  

  /* ---------- 소리와 효과 ---------- */
  var AC=null,soundOn=store(true,'hidden-sketch-sound')!=='off';
  function ctx(){
    if(!soundOn)return null;
    try{
      if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}
      if(AC.state==='suspended')AC.resume();
      return AC;
    }catch(e){return null}
  }
  function tone(f,start,dur,type,vol,slideTo){
    var a=ctx();if(!a)return;
    var t0=a.currentTime+start,o=a.createOscillator(),g=a.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.2,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.03);
  }
  var SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98];
  function sfxFound(n){
    var b=SCALE[Math.min(n,SCALE.length-1)];
    tone(b,0,.16,'triangle',.22);tone(b*1.25,.07,.16,'triangle',.2);tone(b*1.5,.14,.2,'triangle',.2);tone(b*2,.22,.34,'sine',.22);
    tone(b*3,.26,.2,'sine',.08);tone(b*4,.32,.18,'sine',.05);
  }
  function sfxMiss(){tone(190,0,.16,'square',.07,95)}
  function sfxHint(){tone(1318.5,0,.3,'sine',.14);tone(1760,.12,.4,'sine',.1)}
  function sfxWin(){
    var N=[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.51];
    N.forEach(function(f,i){tone(f,i*.13,.28,'triangle',.22);tone(f*2,i*.13,.22,'sine',.06)});
    [523.25,659.25,783.99,1046.5].forEach(function(f){tone(f,.95,.9,'triangle',.14)});
    tone(2093,1.0,.7,'sine',.07);
  }
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function burst(it){
    if(reduce)return;
    var r=it.rects[0],cx=(r[0]+r[2])/2,cy=(r[1]+r[3])/2,rad=(r[2]-r[0])/2;
    for(var i=0;i<22;i++){
      var p=document.createElement('i');p.className='spark';
      var ang=Math.random()*Math.PI*2,dist=70+Math.random()*90;
      p.style.setProperty('--c',i%3===0?'#ffffff':it.color);
      p.style.setProperty('--dx',Math.cos(ang)*dist+'px');p.style.setProperty('--dy',Math.sin(ang)*dist+'px');p.style.setProperty('--rot',(Math.random()*360)+'deg');
      p.style.left=pct(cx+Math.cos(ang)*rad*.9,W);p.style.top=pct(cy+Math.sin(ang)*rad*.9,H);
      sheet.appendChild(p);
      (function(el){setTimeout(function(){el.remove()},950)})(p);
    }
  }
  function confetti(){
    if(reduce)return;
    var box=document.createElement('div');box.className='confetti';
    var cs=['#e5484d','#f08a24','#f5c518','#2fa36b','#3b6fd8','#8a55d7','#d6479a'];
    for(var i=0;i<70;i++){
      var p=document.createElement('i');
      p.style.left=(Math.random()*100)+'%';p.style.background=cs[i%cs.length];
      p.style.setProperty('--t',(1.6+Math.random()*1.6)+'s');p.style.setProperty('--r',(Math.random()*720-360)+'deg');
      p.style.animationDelay=(Math.random()*.5)+'s';box.appendChild(p);
    }
    document.body.appendChild(box);setTimeout(function(){box.remove()},3800);
  }
  function syncSound(){var b=$('soundBtn');b.setAttribute('aria-pressed',soundOn?'true':'false');b.textContent=soundOn?'소리 켜짐':'소리 꺼짐'}
  $('soundBtn').addEventListener('click',function(){
    soundOn=!soundOn;store(false,'hidden-sketch-sound',soundOn?'on':'off');syncSound();
    if(soundOn)sfxHint();
  });
  syncSound();
  buildLegend();reset();
  if(pic.complete&&pic.naturalWidth)drawThumbs();else pic.addEventListener('load',drawThumbs);
})();
</script>
