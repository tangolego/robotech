<title>우주 고양이 숨은그림찾기</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ee;--fg:#2b2622;--card:#fff;--line:#d9d2c8;--acc:#e0593c;--chip:#ece6dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--fg:#efeae3;--card:#2a2724;--line:#443f39;--chip:#35312d}}
:root[data-theme="dark"]{--bg:#1d1b19;--fg:#efeae3;--card:#2a2724;--line:#443f39;--chip:#35312d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.st{font-weight:700;font-variant-numeric:tabular-nums}.sp{flex:1}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:active{background:var(--chip)}
#chips{display:flex;flex-wrap:wrap;gap:5px;padding:6px 12px}
.chip{font-size:12px;background:var(--chip);border-radius:99px;padding:2px 9px;border:2px solid transparent}
.chip.on{color:#fff;text-decoration:none;font-weight:700}
#view{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:#fff;cursor:default}
#view.z{cursor:grab}#view.g{cursor:grabbing}
#pan{position:absolute;left:0;top:0;transform-origin:0 0;width:1754px;height:1240px}
#pan img,#pan svg{position:absolute;left:0;top:0;width:1754px;height:1240px;display:block;-webkit-user-drag:none;user-select:none}
.lab{font-size:30px;font-weight:800;fill:#fff;stroke-width:7px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.ring{fill:none;stroke-width:6px}
.sp1{animation:sp .8s ease-out forwards}@keyframes sp{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
.pop{animation:pp .35s ease-out}@keyframes pp{from{opacity:0}to{opacity:1}}
#tip{padding:6px 12px;font-size:12px;opacity:.75}
#done{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:5}
#done.on{display:flex}
#done div{background:var(--card);border-radius:16px;padding:22px 28px;text-align:center;min-width:260px}
#done h2{margin:0 0 12px}#done p{margin:6px 0}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:6;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#pb{position:relative;height:18px;margin:6px 12px 0;background:var(--chip);border-radius:99px;overflow:hidden;border:1px solid var(--line)}#pf{height:100%;width:0;background:linear-gradient(90deg,#f2b01e,#1fa35b);border-radius:99px;transition:width .5s ease}#pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--fg);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}@media (prefers-reduced-motion:reduce){#pf{transition:none}}
</style></head><body>

const OBJ=[{"id":"jup","name":"목성","color":"#c8855a","poly":[[763,613],[776,624],[784,640],[785,656],[779,674],[770,685],[760,691],[712,694],[702,685],[693,660],[692,642],[696,632],[710,617],[730,608],[744,607]],"cx":738,"cy":652,"r":50},{"id":"sat","name":"토성","color":"#d4a017","poly":[[1075,807],[1078,829],[1075,848],[1066,863],[1047,880],[1034,884],[1015,884],[991,877],[973,863],[963,845],[963,815],[966,808],[977,798],[1011,782],[1027,779],[1042,782]],"cx":1020,"cy":832,"r":60},{"id":"mars","name":"화성","color":"#d6402e","poly":[[928,496],[940,501],[947,509],[948,525],[937,538],[920,541],[911,538],[902,526],[902,513],[915,498]],"cx":925,"cy":519,"r":24},{"id":"earth","name":"지구","color":"#1f7ae0","poly":[[1221,494],[1228,496],[1245,523],[1245,533],[1232,562],[1221,566],[1207,566],[1194,561],[1183,550],[1180,525],[1193,507],[1213,495]],"cx":1213,"cy":532,"r":39},{"id":"alien","name":"외계인","color":"#7a3fd1","poly":[[1008,823],[1022,836],[1012,868],[1004,874],[988,873],[972,856],[973,838],[978,831],[994,822]],"cx":996,"cy":848,"r":28},{"id":"sun","name":"태양","color":"#e6a800","poly":[[1388,120],[1431,132],[1443,146],[1449,162],[1442,200],[1417,221],[1410,223],[1369,217],[1347,190],[1347,156],[1364,131]],"cx":1397,"cy":172,"r":53},{"id":"nep","name":"해왕성","color":"#2a6fd6","poly":[[441,755],[455,765],[462,780],[462,800],[457,812],[444,826],[431,832],[419,834],[397,828],[383,815],[377,803],[377,791],[385,771],[394,762],[409,755],[422,752]],"cx":420,"cy":793,"r":45},{"id":"bh","name":"블랙홀","color":"#222222","poly":[[870,977],[902,1017],[902,1038],[887,1066],[872,1077],[801,1070],[790,1057],[786,1037],[786,1022],[797,998],[814,980],[833,970],[849,969]],"cx":844,"cy":1026,"r":62},{"id":"merc","name":"수성","color":"#6b7280","poly":[[1428,1008],[1426,1016],[1422,1023],[1415,1027],[1407,1029],[1399,1027],[1392,1023],[1388,1016],[1386,1008],[1388,1000],[1392,993],[1399,989],[1407,987],[1415,989],[1422,993],[1426,1000]],"cx":1407,"cy":1008,"r":21},{"id":"ven","name":"금성","color":"#c99a00","poly":[[1131,1124],[1142,1140],[1142,1154],[1138,1162],[1126,1171],[1093,1165],[1085,1148],[1090,1130],[1098,1122],[1114,1117]],"cx":1114,"cy":1145,"r":30},{"id":"ura","name":"천왕성","color":"#0f9fb0","poly":[[519,764],[538,773],[549,788],[551,808],[548,824],[531,842],[519,846],[503,846],[488,840],[474,825],[470,815],[470,795],[479,778],[491,768],[503,764]],"cx":511,"cy":805,"r":42}],W=1754,H=1240,BAND={x:1190,y:305};
const $=i=>document.getElementById(i),view=$('view'),pan=$('pan'),ov=$('ov');
const LEG={jup:[178,185,58],sat:[437,175,55],mars:[662,178,26],earth:[900,182,28],alien:[1100,192,28],sun:[185,293,42],nep:[448,278,42],bh:[766,285,50],merc:[1008,285,22],ven:[1184,310,26],ura:[1363,320,36]};
const NS='http://www.w3.org/2000/svg',RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let found=new Set(),wrong=0,sc=1,fit=1,tx=0,ty=0,t0=0,tm=null,sound=true,ac=null,finished=false;
try{sound=localStorage.getItem('snd')!=='0'}catch(e){}
function area(p){let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a)/2}
function inside(p,x,y){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][1]>y)!==(p[j][1]>y)&&x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0])c=!c}return c}
OBJ.forEach(o=>o.a=area(o.poly));
const order=[...OBJ].sort((a,b)=>a.a-b.a);
$('chips').innerHTML=OBJ.map(o=>`<span class="chip" id="c_${o.id}">${o.name}</span>`).join('');
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function prog(){const n=found.size,p=Math.round(n/OBJ.length*100);$('pf').style.width=p+'%';$('pt').textContent=n+' / '+OBJ.length+' · '+p+'%';$('pb').setAttribute('aria-valuenow',n)}
function tick(){$('t').textContent=fmt((Date.now()-t0)/1000)}
function start(){if(!t0){t0=Date.now();tm=setInterval(tick,500)}}
function clamp(){const vw=view.clientWidth,vh=view.clientHeight,w=W*sc,h=H*sc;tx=w<=vw?(vw-w)/2:Math.min(0,Math.max(vw-w,tx));ty=h<=vh?(vh-h)/2:Math.min(0,Math.max(vh-h,ty))}
function apply(){clamp();pan.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;$('zp').textContent=Math.round(sc/fit*100)+'%';view.classList.toggle('z',sc>fit*1.02)}
function refit(){const f=Math.min(view.clientWidth/W,view.clientHeight/H);const rel=sc/fit;fit=f;sc=f*(rel||1);apply()}
function zoomAt(cx,cy,ns){ns=Math.min(fit*6,Math.max(fit,ns));const k=ns/sc;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;sc=ns;apply()}
$('zi').onclick=()=>zoomAt(view.clientWidth/2,view.clientHeight/2,sc*1.4);
$('zo').onclick=()=>zoomAt(view.clientWidth/2,view.clientHeight/2,sc/1.4);
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,sc*(e.deltaY<0?1.15:1/1.15))},{passive:false});
// 소리
function A(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d,t,type,v,when=0){const c=A();if(!c||!sound)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.05)}
function okSnd(n){const b=523.25*Math.pow(2,(n-1)/12*1.2);[0,4,7,12].forEach((st,i)=>tone(b*Math.pow(2,st/12),.28,0,'triangle',.18,i*.07));tone(b*4,.25,0,'sine',.06,.28)}
function badSnd(){tone(150,.22,0,'sine',.3);tone(95,.28,0,'sine',.3,.05)}
function fan(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.32,0,'square',.1,i*.13))}
$('snd').onclick=()=>{sound=!sound;try{localStorage.setItem('snd',sound?'1':'0')}catch(e){}$('snd').textContent=sound?'소리 켜짐':'소리 꺼짐';A()};
$('snd').textContent=sound?'소리 켜짐':'소리 꺼짐';
// 판정
function mk(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}
function legMark(o){const L=LEG[o.id];if(!L)return;const k=1754/2290,x=L[0]*k,y=L[1]*k,r=L[2]*k;
const g=mk('g',{class:'pop'});g.appendChild(mk('ellipse',{cx:x,cy:y,rx:r+4,ry:r+4,fill:'none',stroke:o.color,'stroke-width':5,'stroke-dasharray':'8 5'}));
const bx=x+r*.75,by=y-r*.75;g.appendChild(mk('circle',{cx:bx,cy:by,r:17,fill:'#1fa35b',stroke:'#fff','stroke-width':3}));
g.appendChild(mk('path',{d:`M${bx-8} ${by+1} L${bx-2} ${by+7} L${bx+9} ${by-6}`,fill:'none',stroke:'#fff','stroke-width':4.5,'stroke-linecap':'round','stroke-linejoin':'round'}));ov.appendChild(g)}
function mark(o){legMark(o);const g=mk('g',{class:'pop'});const R=Math.max(o.r+10,26);
g.appendChild(mk('circle',{cx:o.cx,cy:o.cy,r:R,class:'ring',stroke:o.color}));
const t=mk('text',{x:o.cx,y:Math.min(o.cy+R+32,H-10),class:'lab',stroke:o.color});t.textContent=o.name;g.appendChild(t);ov.appendChild(g);
if(!RM)for(let i=0;i<10;i++){const a=i/10*6.283,d=R+34;const s=mk('circle',{cx:o.cx+Math.cos(a)*R,cy:o.cy+Math.sin(a)*R,r:6,fill:i%2?o.color:'#ffd54a',class:'sp1'});s.style.setProperty('--dx',Math.cos(a)*(d-R)+'px');s.style.setProperty('--dy',Math.sin(a)*(d-R)+'px');ov.appendChild(s);setTimeout(()=>s.remove(),900)}}
function confetti(){if(RM)return;const cs=['#e0593c','#f2b01e','#2a6fd6','#0f9fb0','#7a3fd1'];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%5];d.style.animationDuration=(1.8+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}
function finish(){finished=true;clearInterval(tm);const s=(Date.now()-t0)/1000;let best=s;try{const b=parseFloat(localStorage.getItem('best'));if(b&&b<s)best=b;else localStorage.setItem('best',String(s))}catch(e){}
$('dt').textContent=fmt(s);$('dw').textContent=wrong;$('db').textContent=fmt(best);
setTimeout(()=>{fan();confetti();$('done').classList.add('on')},600)}
function hit(sx,sy){if(finished)return;start();A();const r=pan.getBoundingClientRect();const x=(sx-r.left)/sc,y=(sy-r.top)/sc;
if(x<0||y<0||x>W||y>H)return;if(x<BAND.x&&y<BAND.y)return;
const o=order.find(o=>!found.has(o.id)&&inside(o.poly,x,y));
if(!o&&OBJ.some(f=>found.has(f.id)&&inside(f.poly,x,y)))return;
if(o){found.add(o.id);$('n').textContent=found.size;prog();const c=$('c_'+o.id);c.classList.add('on');c.style.background=o.color;c.style.borderColor=o.color;mark(o);okSnd(found.size);if(found.size===OBJ.length)finish()}
else{wrong++;$('w').textContent=wrong;badSnd()}}
// 끌기 / 클릭
let pt=new Map(),drag=null;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size===1)drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};else drag=null});
view.addEventListener('pointermove',e=>{if(!pt.has(e.pointerId))return;
if(pt.size===2){const ids=[...pt.keys()],p0=pt.get(ids[0]),p1=pt.get(ids[1]);const d0=Math.hypot(p0[0]-p1[0],p0[1]-p1[1]);pt.set(e.pointerId,[e.clientX,e.clientY]);const q0=pt.get(ids[0]),q1=pt.get(ids[1]);const d1=Math.hypot(q0[0]-q1[0],q0[1]-q1[1]);if(d0>0){const r=view.getBoundingClientRect();zoomAt((q0[0]+q1[0])/2-r.left,(q0[1]+q1[1])/2-r.top,sc*d1/d0)}return}
pt.set(e.pointerId,[e.clientX,e.clientY]);if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
if(!drag.moved&&Math.hypot(dx,dy)>=6&&sc>fit*1.02){drag.moved=true;view.classList.add('g')}
if(drag.moved){tx=drag.tx+dx;ty=drag.ty+dy;apply()}});
function up(e){const was=drag;pt.delete(e.pointerId);view.classList.remove('g');if(was&&!was.moved&&e.type==='pointerup')hit(e.clientX,e.clientY);drag=null}
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
function reset(){found=new Set();wrong=0;finished=false;clearInterval(tm);t0=0;ov.innerHTML='';$('n').textContent=0;prog();$('w').textContent=0;$('t').textContent='0:00';$('done').classList.remove('on');document.querySelectorAll('.chip').forEach(c=>{c.classList.remove('on');c.style.background='';c.style.borderColor=''});sc=fit;apply()}
$('rs').onclick=reset;$('again').onclick=reset;
addEventListener('resize',refit);
const im=pan.querySelector('img');fit=Math.min(view.clientWidth/W,view.clientHeight/H);sc=fit;apply();requestAnimationFrame(refit);
</script></body></html>
